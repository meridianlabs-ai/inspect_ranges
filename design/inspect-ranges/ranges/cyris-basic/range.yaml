# range.yaml — schema v0.1 (core sections only; deferred content in ./deferred.yaml)
# Faithful translation of the CyRIS (JAIST) `examples/full.yml` reference range.
# Every value is sourced from ./upstream/ unless marked "default:" or "to-verify".
# Provenance detail: ./notes.md

range:
  name: cyris-basic
  title: CyRIS full example — firewall-segmented office/servers with guest tasks
  schema_version: "0.1"
  description: >
    CyRIS's reference cyber range: a desktop (entry point) in an "office"
    segment and a webserver in a "servers" segment, joined by a firewall VM
    that forwards only ports 25 and 53 office→servers. KVM/libvirt-native
    (the closest substrate precedent for inspect_ranges). Its distinctive
    layer is per-guest setup tasks: accounts, packages, content copy, program
    execution, iptables rulesets, plus emulated attacks/traffic/malware for
    forensics-style noise. Two clone instances deployed from one definition.
  source:
    artifact: CyRIS (github.com/crond-jaist/cyris), examples/full.yml
    license: BSD-3-Clause
    files:
      - upstream/full.yml               # entire definition (verbatim, annotated upstream)
      - upstream/basic-multi_host.yml   # minimal two-physical-host variant (verbatim)
    upstream_substrate: KVM (libvirt); base images defined by libvirt XML (basevm_*.xml)
    fetched: 2026-09-30
    commit: 8b65a30581cdd8e126c7b1fa26db2a4b770b7f17   # upstream commit; every file in upstream/ matches it byte-for-byte

networks:
  - name: office
    # CyRIS assigns cloned-range subnet CIDRs automatically; not stated in the file.
    cidr: 10.1.10.0/24           # default: chosen here; upstream auto-assigns (to-verify)
    mode: isolated               # inter-segment traffic only via the firewall gateway
  - name: servers
    cidr: 10.1.20.0/24           # default: chosen here; upstream auto-assigns (to-verify)
    mode: isolated

routers:
  - name: firewall               # a full guest VM acting as gateway, not substrate routing
    image: basevm_firewall.xml (KVM)   # cloned from the "firewall" base image
    interfaces:                  # upstream pins NIC names (eth0/eth1); NIC naming is generated here
      - { network: office }      # gateway for office members
      - { network: servers }     # gateway for servers members
    acl:                         # upstream `forwarding: {src: office, dst: servers, dport: [25, 53]}`
      - { from: office, to: servers, allow: [tcp/25, tcp/53] }

hosts:
  - name: desktop
    os: { type: linux }          # RPM-based (tasks use yum); exact distro to-verify
    image: basevm_desktop.xml (KVM)
    interfaces:
      - { network: office }      # IP auto-assigned by CyRIS (IPAM here)

  - name: webserver
    os: { type: linux }          # RPM-based; exact distro to-verify
    image: basevm_webserver.xml (KVM)
    interfaces:
      - { network: servers }     # IP auto-assigned by CyRIS (IPAM here)

attacker:
  host: desktop                  # entry_point: yes in clone_settings
  entry: assumed-breach          # trainee/agent lands on the entry-point guest
  egress: none                   # to-verify: not specified upstream (default: none)
