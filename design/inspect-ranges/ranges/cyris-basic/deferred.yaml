# Sections awaiting schema design — NOT valid range.yaml and not consumed by
# anything. Carved verbatim from range.yaml (2026-10-01) when schema v0.1 was
# narrowed to its runtime core; migrate back when the corresponding schema
# sections are designed (see ../../schema-v0.1-scope.md).
#
# Also parked from the core file: the firewall router's upstream NIC pinning
# (`iface: eth0/eth1` per interface) and `is_host: true` (the firewall is a
# cloned guest, i.e. also a target); its `forwarding` rules were translated
# into routers[].acl in range.yaml.

# CyRIS deployment plumbing (host_settings): one physical KVM host, management
# bridge virbr0 at 192.168.122.1, management account cyuser. Kept here because
# guest base images carry management IPs on that bridge pre-clone.
management:
  hypervisor_hosts:
    - { id: host_1, mgmt_addr: localhost, virbr_addr: 192.168.122.1, account: cyuser }
  base_image_ips: { desktop: 192.168.122.50, webserver: 192.168.122.51, firewall: 192.168.122.10 }

# router-level guest configuration (keyed by router name)
routers:
  firewall:
    users:
      - { name: robot.abc, password: abcrb1357 }

# host-level guest configuration (keyed by host name)
hosts:
  desktop:
    users:
      - { name: daniel, password: danielpass, full_name: Daniel Radcliffe }
      - { name: root, password: abcd1234 }  # modify_account
    provisioning:                # CyRIS tasks, in order
      - install_package: { manager: yum, packages: ["wireshark=1.8.10", GeoIP, nmap] }
      - emulate_attack: { type: ssh_attack, target_account: daniel, attempts: 200, date: 2017-11-18 }
      - emulate_traffic_capture_file:
          - { format: pcap, file: /home/trainee/traffic1.pcap, type: ssh_attack, source: 69.89.31.226, noise: medium }
          - { format: pcap, file: /home/trainee/traffic2.pcap, type: dos_attack, noise: medium }
      - emulate_malware: { name: daemon, mode: dummy_calculation, cpu_utilization: 40 }
      - copy_content:
          - { src: /home/cyuser/database/penetration_testing, dst: /bin/cyberrange }
          - { src: /home/cyuser/database/flag.txt, dst: /root }
      - execute_program:
          - { program: /bin/cyberrange/database/penetration_testing/install_pip.sh, interpreter: bash }
          - { program: /bin/cyberrange/database/penetration_testing/prepare.sh, interpreter: bash, when: after_clone }
      - firewall_rules:
          - /home/cyuser/cyris-development/database/firewall_ruleset_forwarding
          - /home/cyuser/cyris-development/database/firewall_ruleset_inputoutput
    data:
      - { path: /root/flag.txt, description: flag, sensitive: true }
  webserver:
    users:
      - { name: daniel, password: JamesBond }
      - { name: root, password: new-root-password }
    services:
      - { name: httpd }          # + php; ports not stated (default: 80)
    provisioning:
      - install_package: { manager: yum, packages: [httpd, php] }
      - emulate_traffic_capture_file:
          - { format: pcap, file: /home/traffic.pcap, type: ddos_attack, noise: medium }
      - copy_content:
          - { src: /home/cyuser/database/penetration_testing, dst: /bin/cyberrange }
          - { src: /home/cyuser/database/aircrack-ng, dst: /bin/cyberrange }
          - { src: /home/cyuser/database/wireless.pcap, dst: /home }
          - { src: /home/cyuser/database/flag.txt, dst: /root }
      - execute_program:
          - { program: /bin/cyberrange/penetration_testing/prepare.sh, interpreter: bash }
          - { program: /bin/cyberrange/aircrack-ng.sh, interpreter: bash }
      - firewall_rules:
          - /home/cyuser/database/firewall_ruleset_webserver
    data:
      - { path: /root/flag.txt, description: flag, sensitive: true }

defense:
  tier: D0
  description: >
    No defenders. Pre-planted attack traces (pcap files, dummy malware,
    ssh-attack log noise) exist for forensics realism, not response.

goals:                           # default: full.yml plants flags but defines no scoring;
  - id: flags                    # flag capture is the conventional CyRIS training goal
    type: flag
    description: Read /root/flag.txt on desktop and webserver.
    target: [desktop:/root/flag.txt, webserver:/root/flag.txt]
    oracle: flag string comparison

attack_path: to-verify           # not declared upstream; entry=desktop, webserver reachable
                                 # only via firewall-forwarded ports 25/53

replication:
  range_id: 125
  instances: 2                   # instance_number: 2 — two full clones of the range
  per_guest_count: { desktop: 1, webserver: 1, firewall: 1 }

lifecycle:
  isolation: per-instance cloned networks/bridges (CyRIS clone phase)
  reset: re-clone from base images
  clock_sync: ntp   # default: no Kerberos constraint
