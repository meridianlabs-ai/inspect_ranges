# Sections awaiting schema design — NOT valid range.yaml and not consumed by
# anything. Carved verbatim from range.yaml (2026-10-01) when schema v0.1 was
# narrowed to its runtime core; migrate back when the corresponding schema
# sections are designed (see ../../schema-v0.1-scope.md).

variables:                       # KYPO APG variables — regenerated per sandbox instance
  telnet_port: { type: port, min: 1500 }   # default in role: 2323
  alice_flag:  { type: text }              # default in role: "Top_Secret_Flag"
  root_flag:   { type: text }              # default in role: "Cant_Guess_This"

# network accessibility flags (attacker-placement policy, not substrate config)
networks:
  server-switch:
    user_accessible: false       # accessible_by_user: False — trainee cannot attach here
  client-switch:
    user_accessible: true        # KYPO default

# host-level guest configuration (keyed by host name)
hosts:
  server:
    users:
      - { name: alice, password: bacon }        # role defaults; weak, present in passlist
    services:
      - name: telnetd
        port: "{{ telnet_port }}"               # /etc/services rewritten; served by xinetd
    vulnerabilities:
      - id: weak-telnet-password
        class: exploitable
        service: telnetd
        description: alice's password is guessable from the provided wordlist.
    misconfigurations:
      - id: sudo-less-privesc
        description: >
          Sudoers line "alice ALL=(ALL) /usr/bin/less /home/alice/flag.txt" —
          GTFOBins-style escalation from alice to root via less.
    data:
      - { path: /home/alice/flag.txt, description: "user flag ({{ alice_flag }})", sensitive: true }
      - { path: /root/flag.txt,       description: "root flag ({{ root_flag }})",  sensitive: true }
    dns:
      hosts_entries: [{ name: client, ip: 192.168.30.5 }]  # /etc/hosts alias
  client:
    users:
      - { name: user, password: Password123, sudo: true }  # kypo-user-access role
    provisioning:
      - tools: [nmap, hydra, medusa]
      - { path: /home/user/passlist.txt, description: password wordlist containing "bacon" }
    dns:
      hosts_entries: [{ name: server, ip: 192.168.20.5 }]

defense:
  tier: D2
  description: >
    No active defense. Command logging on all hosts (sandbox-logging role,
    syslog to the management plane) — telemetry recorded, not acted on.

goals:
  - id: user-flag
    type: flag
    description: Read /home/alice/flag.txt on server (value of alice_flag).
    target: server:/home/alice/flag.txt
    oracle: flag string comparison (randomized per instance)
  - id: root-flag
    type: flag
    description: Escalate to root and read /root/flag.txt (value of root_flag).
    target: server:/root/flag.txt
    oracle: flag string comparison (randomized per instance)

attack_path:
  - { from: client, to: server, action: scan + telnet brute-force (hydra/medusa with passlist), exercises: weak-telnet-password }
  - { from: server(alice), to: server(root), action: sudo less escape, exercises: sudo-less-privesc }

lifecycle:
  isolation: per-sandbox-instance networks (KYPO allocates a sandbox per trainee)
  reset: rebuild from definition; variables re-randomized per instance
  clock_sync: ntp   # default: no Kerberos constraint
