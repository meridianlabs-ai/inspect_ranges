# range.yaml — schema v0.1 (core sections only; deferred content in ./deferred.yaml)
# Faithful translation of the KYPO CRP demo training sandbox (Masaryk University).
# Every value is sourced from ./upstream/ unless marked "default:" or "to-verify".
# Provenance: ./source.md (upstream) and ./notes.md (per-field detail)

range:
  name: kypo-demo
  schema_version: "0.1"
  description: >
    The KYPO Cyber Range Platform demo sandbox: a client (foothold) and a
    server on two routed /24 subnets joined by an explicit Debian router.
    The server exposes telnetd on a per-instance randomized port with a
    weak-password account; privilege escalation is a planted sudoers rule
    (less on a root-readable flag). Two flags, both randomized per instance.
    The smallest public example of an explicitly routed, IP-pinned topology
    with a variables/randomization layer.

networks:
  - name: server-switch
    cidr: 192.168.20.0/24
    mode: routed
  - name: client-switch
    cidr: 192.168.30.0/24
    mode: routed

routers:
  - name: router
    os: { type: linux, distro: debian-9 }
    image: debian-9-x86_64
    resources: { cpus: 1, memory_mb: 2048 }   # default: translated from flavor standard.small
    interfaces:
      - { network: server-switch, ip: 192.168.20.1 }
      - { network: client-switch, ip: 192.168.30.1 }

hosts:
  - name: server
    os: { type: linux, distro: ubuntu-20.04 }   # ubuntu-focal-x86_64
    image: ubuntu-focal-x86_64
    resources: { cpus: 1, memory_mb: 2048 }   # default: translated from flavor standard.small
    interfaces:
      - { network: server-switch, ip: 192.168.20.5 }

  - name: client
    os: { type: linux, distro: ubuntu-20.04 }
    image: ubuntu-focal-x86_64
    resources: { cpus: 1, memory_mb: 2048 }   # default: translated from flavor standard.small
    interfaces:
      - { network: client-switch, ip: 192.168.30.5 }

attacker:
  host: client                   # the trainee's foothold IS the client VM
  entry: assumed-breach
  egress: none                   # to-verify: KYPO NATs egress via the platform; not stated in these files (default: none)
