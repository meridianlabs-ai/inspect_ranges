# range.yaml — draft schema v0.1 (see ../../range-yaml-swag.md)
# Faithful translation of the KYPO CRP demo training sandbox (Masaryk University).
# Every value is sourced from ./upstream/ unless marked "default:" or "to-verify".
# Provenance detail: ./notes.md

range:
  name: kypo-demo
  title: KYPO demo training — routed two-subnet Linux with telnet brute-force + sudo privesc
  schema_version: "0.1"
  description: >
    The KYPO Cyber Range Platform demo sandbox: a client (foothold) and a
    server on two routed /24 subnets joined by an explicit Debian router.
    The server exposes telnetd on a per-instance randomized port with a
    weak-password account; privilege escalation is a planted sudoers rule
    (less on a root-readable flag). Two flags, both randomized per instance.
    The smallest public example of an explicitly routed, IP-pinned topology
    with a variables/randomization layer.
  source:
    artifact: kypo-crp-demo-training (gitlab.ics.muni.cz/muni-kypo-crp/prototypes-and-examples/sandbox-definitions/kypo-crp-demo-training)
    license: MIT
    files:
      - upstream/topology.yml               # hosts/routers/networks/mappings (verbatim)
      - upstream/variables.yml              # per-instance randomized variables (verbatim)
      - upstream/provisioning/playbook.yml  # guest configuration (verbatim)
      - upstream/provisioning/roles/        # server + client roles (verbatim)
    upstream_substrate: OpenStack (KYPO CRP; local variant via Vagrant/VirtualBox)
    fetched: 2026-09-30
    commit: 9d268bc5fbb718341aae902391f82428a5c976bc   # upstream commit; every file in upstream/ matches it byte-for-byte

variables:                       # KYPO APG variables — regenerated per sandbox instance
  telnet_port: { type: port, min: 1500 }   # default in role: 2323
  alice_flag:  { type: text }              # default in role: "Top_Secret_Flag"
  root_flag:   { type: text }              # default in role: "Cant_Guess_This"

networks:
  - name: server-switch
    cidr: 192.168.20.0/24
    mode: routed
    user_accessible: false       # accessible_by_user: False — trainee cannot attach here
  - name: client-switch
    cidr: 192.168.30.0/24
    mode: routed
    user_accessible: true        # KYPO default

routers:
  - name: router
    os: { type: linux, distro: debian-9 }
    image: debian-9-x86_64
    resources: { flavor: standard.small }
    interfaces:
      - { network: server-switch, ip: 192.168.20.1 }
      - { network: client-switch, ip: 192.168.30.1 }

hosts:
  - name: server
    os: { type: linux, distro: ubuntu-20.04 }   # ubuntu-focal-x86_64
    image: ubuntu-focal-x86_64
    resources: { flavor: standard.small }
    interfaces:
      - { network: server-switch, ip: 192.168.20.5 }
    users:
      - { name: alice, password: bacon }        # role defaults; weak, present in passlist
    services:
      - name: telnetd
        port: "{{ telnet_port }}"               # /etc/services rewritten; served by xinetd
    vulnerabilities:
      - id: weak-telnet-password
        class: exploitable
        service: telnetd
        description: alice's password is guessable from the provided wordlist.
    misconfigurations:
      - id: sudo-less-privesc
        description: >
          Sudoers line "alice ALL=(ALL) /usr/bin/less /home/alice/flag.txt" —
          GTFOBins-style escalation from alice to root via less.
    data:
      - { path: /home/alice/flag.txt, description: "user flag ({{ alice_flag }})", sensitive: true }
      - { path: /root/flag.txt,       description: "root flag ({{ root_flag }})",  sensitive: true }
    dns:
      hosts_entries: [{ name: client, ip: 192.168.30.5 }]  # /etc/hosts alias

  - name: client
    os: { type: linux, distro: ubuntu-20.04 }
    image: ubuntu-focal-x86_64
    resources: { flavor: standard.small }
    interfaces:
      - { network: client-switch, ip: 192.168.30.5 }
    users:
      - { name: user, password: Password123, sudo: true }  # kypo-user-access role
    provisioning:
      - tools: [nmap, hydra, medusa]
      - { path: /home/user/passlist.txt, description: password wordlist containing "bacon" }
    dns:
      hosts_entries: [{ name: server, ip: 192.168.20.5 }]

attacker:
  host: client                   # the trainee's foothold IS the client VM
  entry: assumed-breach
  egress: to-verify              # KYPO sandboxes NAT egress via the platform; not stated in these files

defense:
  tier: D2
  description: >
    No active defense. Command logging on all hosts (sandbox-logging role,
    syslog to the management plane) — telemetry recorded, not acted on.

goals:
  - id: user-flag
    type: flag
    description: Read /home/alice/flag.txt on server (value of alice_flag).
    target: server:/home/alice/flag.txt
    oracle: flag string comparison (randomized per instance)
  - id: root-flag
    type: flag
    description: Escalate to root and read /root/flag.txt (value of root_flag).
    target: server:/root/flag.txt
    oracle: flag string comparison (randomized per instance)

attack_path:
  - { from: client, to: server, action: scan + telnet brute-force (hydra/medusa with passlist), exercises: weak-telnet-password }
  - { from: server(alice), to: server(root), action: sudo less escape, exercises: sudo-less-privesc }

lifecycle:
  isolation: per-sandbox-instance networks (KYPO allocates a sandbox per trainee)
  reset: rebuild from definition; variables re-randomized per instance
  clock_sync: ntp   # default: no Kerberos constraint
