# Minimal-device-model spike, running UNDER the hardened container profile
# (same image and security envelope as the hardened-container spike): the two
# envelopes must compose. Mounts the net-compile render (bridges, nft, seeds)
# plus this spike's generated domain XML.
services:
  range:
    build: ../hardened-container/range
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - SETPCAP
      - KILL
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/kvm
      - /dev/vhost-vsock
      - /dev/vhost-net
      - /dev/net/tun
    volumes:
      - ${IMAGE_CACHE:-~/.cache/inspect-ranges/images}:/images:ro
      - scratch:/scratch
      - ../net-compile/tmp/render:/render:ro
      - ./tmp/xml:/mdxml:ro
    healthcheck:
      test: ["CMD", "test", "-e", "/run/range-ready"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  scratch:
