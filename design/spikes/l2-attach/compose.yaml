# Spike topology per handoff §4: a `range` container (libvirtd+QEMU, bridges in
# its own netns) and a `default` agent container (no network until veth attach).
# Lab segment: 10.80.10.0/24 — vm1 .10, agent .2.
services:
  range:
    build: ./range
    # QEMU gets reparented to PID 1 when libvirt starts it; without an init to
    # reap it, destroyed VMs stay as zombies and `virsh destroy` fails
    init: true
    devices:
      - /dev/kvm
      - /dev/net/tun
      - /dev/vhost-net
    cap_add:
      - NET_ADMIN
    security_opt:
      - apparmor=unconfined
    volumes:
      - ${IMAGE_CACHE:-~/.cache/inspect-ranges/images}:/images:ro
      - scratch:/scratch
      - ./assets:/assets:ro
    healthcheck:
      test: ["CMD", "test", "-e", "/run/range-ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  agent:
    build: ./agent
    network_mode: none
    cap_add:
      - NET_ADMIN
      - NET_RAW

volumes:
  scratch:
