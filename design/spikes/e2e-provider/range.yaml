# Minimal schema-v0.1 range for the end-to-end provider spike: one isolated
# segment, one Linux target, one dedicated attack VM. Both guests run the
# spike's vsockd2 daemon (baked into the noble-e2e image).
range:
  name: e2e-smoke
  schema_version: "0.1"
  description: >
    Smoke-test range for the Inspect sandbox-provider spike: validates the
    chain eval -> provider -> compiled range -> booted VMs -> vsock exec.

networks:
  - name: lab
    cidr: 10.90.10.0/24
    mode: isolated

hosts:
  - name: web
    os: { type: linux, distro: ubuntu-24.04 }
    image: noble-e2e
    interfaces: [{ network: lab, ip: 10.90.10.10 }]

attacker:
  interfaces: [{ network: lab, ip: 10.90.10.2 }]
  image: noble-e2e
  entry: external
  egress: none
