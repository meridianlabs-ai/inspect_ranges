name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

jobs:
  py-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Ruff only reads the source, so the project itself does not install.
      - uses: meridianlabs-ai/actions/install-python-dependencies@4757bdf4154f25f6118bf797d04160c16a07f824 # main
        with:
          versions: locked
          python-version: "3.12"
          project-install: skip
          extras: dev
      - name: Lint with Ruff
        run: uv run --no-sync ruff check --output-format github .
      - name: Format with Ruff
        run: uv run --no-sync ruff format --check --output-format github .
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-pyright:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      # make uv use the matrix version instead of the .python-version pin
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: meridianlabs-ai/actions/install-python-dependencies@4757bdf4154f25f6118bf797d04160c16a07f824 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Run pyright
        run: uv run --no-sync pyright
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      # make uv use the matrix version instead of the .python-version pin
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: meridianlabs-ai/actions/install-python-dependencies@4757bdf4154f25f6118bf797d04160c16a07f824 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Install qemu-utils (the overlay clamp test reads a real qcow2's virtual size) and nftables (the ruleset kernel-load test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils nftables
      - name: Install the pinned Go toolchain (the cross-codec drift guard)
        run: |
          curl -fsSL -o /tmp/go.tgz https://go.dev/dl/go1.23.6.linux-amd64.tar.gz
          echo "9379441ea310de000f33a4dc767bd966e72ab2826270e038e78b2c53c2e7802d  /tmp/go.tgz" | sha256sum -c
          mkdir -p "$HOME/.local/go-toolchains"
          tar -C "$HOME/.local/go-toolchains" -xzf /tmp/go.tgz
          mv "$HOME/.local/go-toolchains/go" "$HOME/.local/go-toolchains/go1.23.6"
          "$HOME/.local/go-toolchains/go1.23.6/bin/go" version
      - name: Install the pinned .NET SDK (the C# codec drift guard)
        run: |
          curl -fsSL -o /tmp/dotnet.tgz https://builds.dotnet.microsoft.com/dotnet/Sdk/8.0.404/dotnet-sdk-8.0.404-linux-x64.tar.gz
          echo "5bf340ba6acb314c703c2492a3a6e1530d7cdbfd3b5bf86788ee8b4afefd3573  /tmp/dotnet.tgz" | sha256sum -c
          mkdir -p "$HOME/.local/dotnet"
          tar -C "$HOME/.local/dotnet" -xzf /tmp/dotnet.tgz
          "$HOME/.local/dotnet/dotnet" --version
      - name: Run tests
        run: uv run --no-sync pytest
        env:
          # the Go drift guard and bundle determinism battery must RUN in CI,
          # never silently skip (tests fail loudly if the toolchain is absent)
          INSPECT_RANGES_REQUIRE_GO: "1"
          # same contract for the C# codec drift guard: the third codec's
          # parity is enforced here, never silently skipped
          INSPECT_RANGES_REQUIRE_DOTNET: "1"
          # rendered rulesets must LOAD into a kernel here, never silently
          # skip: the 0.2.5 regression shipped exactly through that gap
          INSPECT_RANGES_REQUIRE_NETNS: "1"
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      # make uv use the matrix version instead of the .python-version pin
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The build toolchain that publish.yaml uses, pinned with hashes. To
      # update the file, see publish.yaml.
      - name: Install build toolchain
        uses: meridianlabs-ai/actions/install-python-dependencies@4757bdf4154f25f6118bf797d04160c16a07f824 # main
        with:
          versions: hashed-requirements
          python-version: ${{ matrix.python-version }}
          requirements-file: scripts/build-dist/requirements.txt
          package-format: wheels-only
          environment-dir: ${{ runner.temp }}/build-venv
          actions-cache: none
      - name: Build package
        id: build
        run: |
          "$RUNNER_TEMP/build-venv/bin/python" -m build --no-isolation
          wheels=(dist/*.whl)
          [ ${#wheels[@]} -eq 1 ] && [ -f "${wheels[0]}" ] || { echo "::error::expected one wheel in dist/"; exit 1; }
          # ./ marks a local path for the install action.
          echo "wheel=./${wheels[0]}" >> "$GITHUB_OUTPUT"
      # The locked runtime dependencies, without the dev group and without the
      # project, then the wheel with --no-deps. A second call in a job must use
      # the first call's actions-cache.
      - uses: meridianlabs-ai/actions/install-python-dependencies@4757bdf4154f25f6118bf797d04160c16a07f824 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          project-install: skip
          default-dependency-groups: exclude
          also-install-without-deps: ${{ steps.build.outputs.wheel }}
          actions-cache: none
      - name: Verify package
        # -I so the import resolves to the installed wheel, not the checkout's src/.
        run: .venv/bin/python -I -c "import inspect_ranges; print('Package imported successfully')"
